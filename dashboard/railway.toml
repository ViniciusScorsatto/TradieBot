[build]
builder = "RAILPACK"
buildCommand = "npm run build:dashboard"
watchPatterns = [
  "/dashboard/**",
  "/packages/shared/**",
  "/package.json",
  "/tsconfig.base.json",
  "/prisma/**"
]

[deploy]
startCommand = "npm run start:dashboard"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ALWAYS"
restartPolicyMaxRetries = 10
preDeployCommand = "npm run prisma:deploy"
